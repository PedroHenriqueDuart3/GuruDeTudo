<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevTools Workspace — JSON Organizer, Cron Manager, XML Visualizer e Database Diagram Generator, com processamento 100% local." />
    <meta name="theme-color" content="#0a0f18" />
    <title>GuruDeTudo</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint (evita flash de tema errado)
      try {
        var s = JSON.parse(localStorage.getItem('dtw-settings') || '{}').state || {}
        var t = s.theme || 'dark'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
